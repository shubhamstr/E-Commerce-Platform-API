name: phpMyAdmin – Deploy on Port 4006

# Trigger: manual only via GitHub Actions UI
on:
  workflow_dispatch:
    inputs:
      port:
        description: "Host port to expose phpMyAdmin on EC2"
        required: true
        default: "4006"
      db_host:
        description: "Database host/container (leave blank to auto-detect ecom-mysql / EC2_HOST)"
        required: false
        default: ""

jobs:
  deploy-phpmyadmin:
    name: Deploy phpMyAdmin Container
    runs-on: ubuntu-latest

    steps:
      - name: Deploy phpMyAdmin on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          PMA_PORT: ${{ github.event.inputs.port || '4006' }}
          CUSTOM_DB_HOST: ${{ github.event.inputs.db_host }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          envs: PMA_PORT,CUSTOM_DB_HOST,EC2_HOST
          script: |
            set -e

            echo "=========================================="
            echo " Deploying phpMyAdmin on Port $PMA_PORT"
            echo "=========================================="

            # 1. Ensure shared Docker bridge network exists
            docker network create ecom-network 2>/dev/null || true

            # 2. Attach MySQL container to the network if it is running
            if docker ps --format '{{.Names}}' | grep -q '^ecom-mysql$'; then
              echo ">>> Found running ecom-mysql container, connecting to ecom-network..."
              docker network connect ecom-network ecom-mysql 2>/dev/null || true
              DETECTED_DB_HOST="ecom-mysql"
            fi

            # 3. Determine database host to use
            if [ -n "$CUSTOM_DB_HOST" ]; then
              TARGET_DB_HOST="$CUSTOM_DB_HOST"
            elif [ -n "$DETECTED_DB_HOST" ]; then
              TARGET_DB_HOST="$DETECTED_DB_HOST"
            elif [ -n "$EC2_HOST" ]; then
              TARGET_DB_HOST="$EC2_HOST"
            else
              TARGET_DB_HOST="172.17.0.1"
            fi

            echo ">>> Target Database Host: $TARGET_DB_HOST"

            # 4. Stop and remove existing phpMyAdmin container if present
            echo ">>> Stopping old phpMyAdmin container if exists..."
            docker stop ecom-phpmyadmin 2>/dev/null || true
            docker rm   ecom-phpmyadmin 2>/dev/null || true

            # 5. Pull official phpMyAdmin image
            echo ">>> Pulling official phpMyAdmin image (phpmyadmin:5.2.2)..."
            docker pull phpmyadmin:5.2.2

            # 6. Launch phpMyAdmin container on specified port (default 4006)
            # Cookie authentication mode: no PMA_USER or PMA_PASSWORD is set,
            # so the login screen is displayed and requires username & password to enter.
            echo ">>> Starting phpMyAdmin container on port $PMA_PORT (password-protected)..."
            docker run -d \
              --name ecom-phpmyadmin \
              --restart unless-stopped \
              --network ecom-network \
              --add-host host.docker.internal:host-gateway \
              -p "${PMA_PORT}:80" \
              -e PMA_HOST="$TARGET_DB_HOST" \
              -e PMA_PORT=3306 \
              -e UPLOAD_LIMIT=300M \
              phpmyadmin:5.2.2

            # 7. Health verification
            echo ">>> Verifying phpMyAdmin readiness..."
            for i in $(seq 1 15); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${PMA_PORT}" || true)
              if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
                echo "✅ phpMyAdmin is running and responding (HTTP $HTTP_STATUS) on port $PMA_PORT!"
                break
              fi
              echo "  attempt $i/15 (status: $HTTP_STATUS) – retrying in 2s..."
              sleep 2
            done

            # 8. Clean dangling Docker images
            docker image prune -f

            echo "=========================================="
            echo " phpMyAdmin successfully deployed on port $PMA_PORT"
            echo " Access URL: http://${EC2_HOST}:${PMA_PORT}"
            echo "=========================================="

