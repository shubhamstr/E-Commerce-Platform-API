name: MySQL DB – Run Migrations

# Trigger: manual only via GitHub Actions UI
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Run Sequelize Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Migrations
        env:
          NODE_ENV:    production
          DB_HOST:     ${{ secrets.EC2_HOST }}
          DB_PORT:     3306
          DB_NAME:     ${{ secrets.DB_NAME }}
          DB_USER:     root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DIALECT:  mysql
        run: |
          npx sequelize-cli db:migrate --env production
          echo "✅ Migrations complete."

